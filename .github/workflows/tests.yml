name: Full Tests

# no permissions by default
permissions: {}

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  run:
    name:  ${{ matrix.os }} ${{ matrix.python-version }} numba=${{ matrix.numba }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.11", "3.15-dev" ]
        os: [ ubuntu-latest ]
        include:
          - os: windows-latest
            python-version: "3.15-dev"
          - os: macos-latest
            python-version: "3.15-dev"
          - os: macos-15-intel
            python-version: "3.15-dev"
        numba: [true, false]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install library
      run: |
        pip install --group dev
        pip install -e .[extras]

    - name: numba
      if: ${{ matrix.numba }}
      run: |
        pip install numba

    - name: Tests
      run: |
        python -m pytest --disable-warnings
