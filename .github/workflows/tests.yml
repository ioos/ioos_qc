name: Full Tests

# no permissions by default
permissions: {}

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  run:
    name: ${{ matrix.os }} ${{ matrix.python-version }} numba=${{ matrix.numba }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
        os: [ ubuntu-latest ]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            numba: true
          - os: windows-latest
            python-version: "3.14"
            numba: false
          - os: macos-latest
            python-version: "3.14"
            numba: false
          - os: macos-15-intel
            python-version: "3.14"
            numba: false
        numba: [ false ]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install library
      run: |
        pip install --group dev
        pip install -e .

    - name: numba
      if: ${{ matrix.numba }}
      run: |
        pip install numba

    - name: Tests
      run: |
        python -m pytest --disable-warnings
